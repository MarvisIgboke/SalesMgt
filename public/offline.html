<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesMgt — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0a0a0b;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .card {
        max-width: 24rem;
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.02);
      }
      h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
      p { font-size: 0.85rem; color: #a1a1aa; line-height: 1.5; margin: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        SalesMgt cached this shell for offline use. Reconnect to continue — queued
        transactions will synchronize automatically.
      </p>
    </div>
  </body>
</html>
